name: Publicar no GitHub Pages

# A cada push em main:
#   1) se supabase/ mudou (ou execução manual), aplica schema.sql no banco (idempotente, numa única transação)
#   2) testa, compila e grava o app no branch gh-pages (servido pelo GitHub Pages)
# Se a etapa do banco falhar, o app novo NÃO é publicado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  banco:
    name: Atualizar banco (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar se houve mudança no banco
        id: mudou
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- supabase/; then
            echo "Nenhuma mudança em supabase/ — banco não precisa ser atualizado."
            echo "sim=0" >> "$GITHUB_OUTPUT"
          else
            echo "sim=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Aplicar supabase/schema.sql
        if: steps.mudou.outputs.sim == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: dlrcvcjqofxkdyujfzhy
          SUPABASE_POOLER_HOST: aws-1-ca-central-1.pooler.supabase.com
        run: |
          # Preferência: segredo só com a senha (SUPABASE_DB_PASSWORD); o endereço é montado aqui.
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "::add-mask::$SUPABASE_DB_PASSWORD"
            pw_enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1].strip(), safe=""))' "$SUPABASE_DB_PASSWORD")
            echo "::add-mask::$pw_enc"
            SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${pw_enc}@${SUPABASE_POOLER_HOST}:5432/postgres"
            echo "Usando SUPABASE_DB_PASSWORD (endereço montado automaticamente)."
            python3 - "$SUPABASE_DB_PASSWORD" <<'PY'
          import sys
          p = sys.argv[1].strip()
          tipos = [n for n, ok in [("letras", any(c.isalpha() for c in p)), ("números", any(c.isdigit() for c in p)),
                   ("símbolos", any(not c.isalnum() for c in p))] if ok]
          print(f"Diagnóstico (sem revelar a senha): {len(p)} caracteres; contém {', '.join(tipos) or 'nada'}.")
          if any(c in p for c in "•●*"): print("::warning::A senha parece conter pontos de máscara (•/*): copie a senha real, não o campo mascarado.")
          PY
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Segredo SUPABASE_DB_PASSWORD (ou SUPABASE_DB_URL) não configurado — atualização do banco ignorada."
            exit 0
          fi
          # Nunca exibir a senha: valida o formato sem imprimir o valor e mascara a senha no log.
          # Remove espaços/quebras de linha nas pontas (comuns ao copiar pelo celular).
          SUPABASE_DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          # Converte a "Direct connection" (db.<ref>.supabase.co, só IPv6) para o Session pooler (IPv4).
          if printf '%s' "$SUPABASE_DB_URL" | grep -Eq '@db\.[a-z0-9]+\.supabase\.co'; then
            SUPABASE_DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | sed -E "s#^(postgres(ql)?://)postgres:([^@]*)@db\.([a-z0-9]+)\.supabase\.co(:[0-9]+)?#\1postgres.\4:\3@${SUPABASE_POOLER_HOST}:5432#")
            echo "Endereço 'Direct connection' convertido automaticamente para o Session pooler."
          fi
          problemas=""
          case "$SUPABASE_DB_URL" in postgresql://*|postgres://*) ;; *) problemas="$problemas\n- não começa com postgresql:// (copie o endereço inteiro)";; esac
          ats=$(printf '%s' "$SUPABASE_DB_URL" | tr -cd '@' | wc -c)
          [ "$ats" -eq 0 ] && problemas="$problemas\n- não tem @ (endereço incompleto)"
          [ "$ats" -gt 1 ] && problemas="$problemas\n- tem $ats símbolos @ (deve ter 1): a senha contém @"
          printf '%s' "$SUPABASE_DB_URL" | grep -q '[][]' && problemas="$problemas\n- tem colchetes [ ]: troque [YOUR-PASSWORD] inteiro (com colchetes) pela senha"
          printf '%s' "$SUPABASE_DB_URL" | grep -q 'YOUR-PASSWORD' && problemas="$problemas\n- ainda contém YOUR-PASSWORD: a senha não foi colocada"
          printf '%s' "$SUPABASE_DB_URL" | grep -q '[[:space:]]' && problemas="$problemas\n- tem espaço no meio do endereço"
          host_part=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[^@]*@##')
          case "$host_part" in
            *pooler.supabase.com*) ;;
            db.*supabase.co*) problemas="$problemas\n- é a 'Direct connection' (db....supabase.co), que o GitHub não alcança: use Connect > Direct > Session pooler";;
            *) problemas="$problemas\n- o servidor não é do Supabase pooler (esperado ...pooler.supabase.com): use Connect > Direct > Session pooler";;
          esac
          if [ -n "$problemas" ]; then
            printf "::error::SUPABASE_DB_URL inválido (o valor não é exibido). Problemas encontrados:%b\n" "$problemas" | tr '\n' ' '
            echo
            printf "Problemas encontrados no SUPABASE_DB_URL:%b\n" "$problemas"
            exit 1
          fi
          pw=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).password or "")' "$SUPABASE_DB_URL")
          [ -n "$pw" ] && echo "::add-mask::$pw"
          if ! psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -q -f supabase/schema.sql 2> erro.txt; then
            sed -E 's#"[^"]*"#"<oculto>"#g; s#postgres(ql)?://[^ ]*#<url oculta>#g; s#[^ ]*pooler\.supabase\.com[^ ]*#<oculto>#g' erro.txt
            echo "::error::Falha ao atualizar o banco (detalhes acima, sem dados sensíveis). O app NÃO foi publicado."
            exit 1
          fi
          cat erro.txt | grep -v NOTICE || true
          echo "Banco atualizado."

  publicar:
    name: Testar, compilar e publicar
    needs: banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar dist/ em gh-pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicação de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
