name: Publicar no GitHub Pages

# A cada push em main:
#   1) se supabase/ mudou (ou execução manual), aplica schema.sql no banco (idempotente, numa única transação)
#   2) testa, compila e grava o app no branch gh-pages (servido pelo GitHub Pages)
# Se a etapa do banco falhar, o app novo NÃO é publicado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  banco:
    name: Atualizar banco (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar se houve mudança no banco
        id: mudou
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- supabase/; then
            echo "Nenhuma mudança em supabase/ — banco não precisa ser atualizado."
            echo "sim=0" >> "$GITHUB_OUTPUT"
          else
            echo "sim=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Aplicar supabase/schema.sql
        if: steps.mudou.outputs.sim == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Segredo SUPABASE_DB_URL não configurado — atualização do banco ignorada."
            exit 0
          fi
          # Nunca exibir a senha: valida o formato sem imprimir o valor e mascara a senha no log.
          ats=$(printf '%s' "$SUPABASE_DB_URL" | tr -cd '@' | wc -c)
          if [ "$ats" -ne 1 ] || printf '%s' "$SUPABASE_DB_URL" | grep -q '[][ ]'; then
            echo "::error::SUPABASE_DB_URL inválido. A senha não pode conter @, colchetes ou espaços: redefina a senha do banco só com letras e números e atualize o segredo."
            exit 1
          fi
          pw=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).password or "")' "$SUPABASE_DB_URL")
          [ -n "$pw" ] && echo "::add-mask::$pw"
          if ! psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -q -f supabase/schema.sql 2> erro.txt; then
            sed -E 's#"[^"]*"#"<oculto>"#g; s#postgres(ql)?://[^ ]*#<url oculta>#g; s#[^ ]*pooler\.supabase\.com[^ ]*#<oculto>#g' erro.txt
            echo "::error::Falha ao atualizar o banco (detalhes acima, sem dados sensíveis). O app NÃO foi publicado."
            exit 1
          fi
          cat erro.txt | grep -v NOTICE || true
          echo "Banco atualizado."

  publicar:
    name: Testar, compilar e publicar
    needs: banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar dist/ em gh-pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicação de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
